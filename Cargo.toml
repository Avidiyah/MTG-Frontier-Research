[package]
name = "mtg-discover"
version = "0.1.0"
edition = "2024"
description = "Agent-friendly discovery tools for MTG Oracle text and Comprehensive Rules"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

